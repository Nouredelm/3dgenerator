
name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        # Passing a placeholder so the missing local .env doesn't crash the build
        env:
          GEMINI_API_KEY: "placeholder_key_to_allow_frontend_build"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload compiled artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # This strictly serves the compiled output, fixing the 404

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
